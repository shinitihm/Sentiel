name: CI/CD

# CI: todo push na main e todo pull request para a main.
# CD: só em push na main, e só depois que test + build + container passarem.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- CI
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.14' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: sentiel demo --no-ai

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: docker/setup-buildx-action@v4
      - name: Build image (local, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: sentiel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 scripts/image_check.py expected-version)"
          got="$(docker run --rm sentiel:ci version | tr -d '[:space:]')"
          echo "image version: $got (expected $expected)"
          test "$got" = "$expected"
          docker run --rm sentiel:ci > demo.txt
          cat demo.txt
          python3 scripts/image_check.py demo-output demo.txt

  # ---------------------------------------------------------------- CD
  deploy:
    needs: [test, build, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: ghcr
      url: https://github.com/${{ github.repository }}/pkgs/container/sentiel
    concurrency:
      group: deploy-ghcr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Image name (lowercase)
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sentiel" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short
      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Verify published image
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-$SHORT_SHA"
          docker rmi -f "$ref" >/dev/null 2>&1 || true
          docker pull "$ref"
          expected="$(python3 scripts/image_check.py expected-version)"
          got="$(docker run --rm "$ref" version | tr -d '[:space:]')"
          test "$got" = "$expected"
          docker run --rm "$ref" > demo.txt
          python3 scripts/image_check.py demo-output demo.txt
          {
            echo "### Deploy OK"
            echo ""
            echo "- Imagem: \`$ref\` (também \`latest\` e \`main\`)"
            echo "- Versão: \`$got\`"
            echo "- Rodar: \`docker run --rm $IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
