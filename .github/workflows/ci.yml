name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.14' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q --durations=10
      - run: sentiel demo --no-ai

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # CD: roda so em push na main e so se test + build passaram.
  # Publica no GitHub Pages o wheel/sdist que passou na CI (artefato do job build, sem rebuild)
  # junto com a saida da demo, e confere que o site no ar mostra o build publicado.
  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pip install dist/*.whl
      - name: Gerar site estatico
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/dist
          cp dist/* site/dist/
          sentiel demo --no-ai > demo.txt 2>&1
          {
            echo "<!doctype html><meta charset=utf-8><title>Sentiel</title>"
            echo "<h1>Sentiel</h1><p>Build de ${GITHUB_SHA::7} (main).</p>"
            echo "<h2>sentiel demo --no-ai</h2><pre>"
            python -c "import html,sys; print(html.escape(open('demo.txt',encoding='utf-8',errors='replace').read()))"
            echo "</pre><h2>Pacotes</h2><ul>"
            for f in dist/*; do echo "<li><a href=\"dist/$(basename "$f")\">$(basename "$f")</a></li>"; done
            echo "</ul>"
          } > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar site publicado
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          wheel="$(basename dist/*.whl)"
          for i in $(seq 1 12); do
            page="$(curl -fsSL "${PAGE_URL}?v=${GITHUB_SHA}")" || page=""
            if grep -q "Build de ${short}" <<<"$page"; then
              curl -fsSLI --retry 3 "${PAGE_URL}dist/${wheel}" > /dev/null || { echo "::error::Wheel ${wheel} nao responde no site publicado"; exit 1; }
              {
                echo "### Deploy verificado"
                echo ""
                echo "- Site: ${PAGE_URL}"
                echo "- Build no ar: \`${short}\`"
                echo "- Wheel publicado: \`${wheel}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Site no ar com o build ${short}"
              exit 0
            fi
            echo "Tentativa ${i}: site ainda sem o build ${short}"
            sleep 10
          done
          echo "::error::Site publicado nao mostra o build ${short}"
          exit 1
