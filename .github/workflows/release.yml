name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(python3 -c "import re, pathlib; print(re.search(r'^__version__\s*=\s*[\"\']([^\"\']+)[\"\']', pathlib.Path('sentiel/__init__.py').read_text(encoding='utf-8'), re.M).group(1))")"
          if [ "$GITHUB_REF_NAME" != "v$pkg_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match sentiel.__version__ '$pkg_version'"
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
