[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentiel"
version = "0.2.0"
description = "Personal AI-powered SOC: Sigma detection + LLM triage with any model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "pysigma>=0.11",
    "pysigma-backend-sqlite>=1.0",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tenacity>=8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sentiel = "sentiel.cli:app"

[tool.pytest.ini_options]
markers = ["llm: needs a real LLM (Ollama or API key)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
